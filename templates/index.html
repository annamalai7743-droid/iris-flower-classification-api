<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Iris Flower Classifier</h2>
        <form action="/" method="POST">
            <div class="input-group">
                <label>Sepal Length:</label>
                <input type="number" step="0.1" name="sepal_length" placeholder="e.g. 5.1" required>
            </div>
            
            <div class="input-group">
                <label>Sepal Width:</label>
                <input type="number" step="0.1" name="sepal_width" placeholder="e.g. 3.5" required>
            </div>
            
            <div class="input-group">
                <label>Petal Length:</label>
                <input type="number" step="0.1" name="petal_length" placeholder="e.g. 1.4" required>
            </div>
            
            <div class="input-group">
                <label>Petal Width:</label>
                <input type="number" step="0.1" name="petal_width" placeholder="e.g. 0.2" required>
            </div>
            
            <button type="submit">Predict Flower</button>
        </form>

        {% if prediction %}
            <div class="result">
                <h3>Predicted Flower: <span>{{ prediction }}</span></h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
